name: Validate foundation
on: [push, pull_request]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore backend/Viw.FuncionalSoccer.slnx
      - run: dotnet build backend/Viw.FuncionalSoccer.slnx --configuration Release --no-restore
      - run: dotnet test backend/Viw.FuncionalSoccer.slnx --configuration Release --no-build
      - run: dotnet build frontend/Viw.Mvc/Viw.Mvc.csproj --configuration Release
      - run: docker compose config --quiet
      - run: docker compose build webapi mvc worker tests
      - run: docker compose --profile tests run --rm tests
