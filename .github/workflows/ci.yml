name: Validate foundation
on: [push, pull_request]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Viw_CI_Only!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Viw_CI_Only!2026' -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__ViwTestServer: Server=localhost,1433;User Id=sa;Password=Viw_CI_Only!2026;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/viw-admin/.nvmrc
          cache: npm
          cache-dependency-path: frontend/viw-admin/package-lock.json
      - run: npm ci
        working-directory: frontend/viw-admin
      - run: npm test
        working-directory: frontend/viw-admin
      - run: npm run build
        working-directory: frontend/viw-admin
      - run: dotnet restore backend/Viw.FuncionalSoccer.slnx
      - run: dotnet build backend/Viw.FuncionalSoccer.slnx --configuration Release --no-restore
      - run: dotnet test backend/Viw.FuncionalSoccer.slnx --configuration Release --no-build
      - run: dotnet test frontend/mvc/Viw.Frontend.slnx --configuration Release
      - run: docker compose config --quiet
      - run: docker compose build webapi mvc worker tests mvc-tests
      - run: docker compose --profile tests run --rm tests
      - run: docker compose --profile tests run --rm mvc-tests
