name: viw-funcional-soccer
services:
  webapi:
    build:
      context: .
      dockerfile: backend/src/Viw.WebApi/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
  mvc:
    build:
      context: .
      dockerfile: frontend/Viw.Mvc/Dockerfile
    ports:
      - "127.0.0.1:5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ViwApi__BaseUrl: http://webapi:8080/
    depends_on:
      - webapi
  worker:
    build:
      context: .
      dockerfile: backend/src/Viw.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Imports__Enabled: "false"
  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: backend/tests/Dockerfile
  migrations:
    profiles: [migrations]
    build:
      context: .
      dockerfile: backend/src/Viw.Infrastructure/Dockerfile.migrations
    environment:
      ConnectionStrings__ViwDatabase: ${ConnectionStrings__ViwDatabase:-}
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
volumes:
  sqlserver-data:
