name: viw-funcional-soccer
services:
  webapi:
    build:
      context: .
      dockerfile: backend/src/Viw.WebApi/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ViwDatabase: ${ConnectionStrings__ViwDatabase:-}
      Monitoring__ApiKey: ${VIW_MONITORING_API_KEY:-}
      Admin__BootstrapEmail: ${ADMIN_BOOTSTRAP_EMAIL:-}
      Admin__BootstrapPassword: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      Admin__DataProtectionKeysPath: /data/keys
      Media__LocalPath: /media/media
    volumes:
      - admin-keys:/data/keys
      - worker-media:/media:ro
  mvc:
    build:
      context: .
      dockerfile: frontend/mvc/Viw.Mvc/Dockerfile
    ports:
      - "127.0.0.1:5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ViwApi__BaseUrl: http://webapi:8080/
      Site__PublicBaseUrl: ${VIW_PUBLIC_BASE_URL:-http://localhost:5081/}
    depends_on:
      - webapi
  worker:
    build:
      context: .
      dockerfile: backend/src/Viw.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Imports__Enabled: ${VIW_IMPORTS_ENABLED:-false}
      ConnectionStrings__ViwDatabase: ${ConnectionStrings__ViwDatabase:-}
      Media__LocalPath: /data/media
    volumes:
      - worker-media:/data
  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: backend/tests/Dockerfile
  mvc-tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: frontend/mvc/tests/Dockerfile
  migrations:
    profiles: [migrations]
    build:
      context: .
      dockerfile: backend/src/Viw.Infrastructure/Dockerfile.migrations
    environment:
      ConnectionStrings__ViwDatabase: ${ConnectionStrings__ViwDatabase:-}
  admin-migrations:
    profiles: [migrations]
    build:
      context: .
      dockerfile: backend/src/Viw.WebApi/Dockerfile.migrations
    environment:
      ConnectionStrings__ViwDatabase: ${ConnectionStrings__ViwDatabase:-}
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
volumes:
  admin-keys:
  worker-media:
  sqlserver-data:
